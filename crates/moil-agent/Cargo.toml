[package]
name = "moil-agent"
description = "The machine side of moil: pairing, approvals, and the agent that takes jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
moil-proto.workspace = true
moil-bundle.workspace = true
moil-runtime.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
tempfile.workspace = true
axum = { version = "0.8", features = ["ws"] }

[lints]
workspace = true
